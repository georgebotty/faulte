<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>FAULTLE: Diagnose the fault in six clues</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5b301'/%3E%3Cpath d='M44 12a12 12 0 0 0-11 16L14 47a4.5 4.5 0 0 0 6 6l19-19a12 12 0 0 0 16-11l-7 4-6-3-1-7z' fill='%23111'/%3E%3C/svg%3E">
<style>
/* =====================================================================
 * THEME — workshop palette. Dark by default; .light on <html> swaps it.
 * ===================================================================== */
:root {
  --bg: #0f1113;
  --bg2: #16191c;
  --panel: #1c2024;
  --panel2: #23282d;
  --line: #31373d;
  --text: #e8e6e1;
  --muted: #8d949b;
  --accent: #f5b301;      /* hazard yellow */
  --accent2: #ff7a1a;     /* safety orange */
  --hit: #3ddc84;
  --close: #f5a524;
  --miss: #e5484d;
  --skip: #4a5158;
  --screen: #0a1a12;      /* OBD screen */
  --screen-text: #9cf5c0;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --radius: 14px;
  --head: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
}
html.light {
  --bg: #e9e6df; --bg2: #ddd9d0; --panel: #f7f5f0; --panel2: #ecE9e2; --line: #c9c4b8;
  --text: #1d2125; --muted: #5f666d; --screen: #e3efe7; --screen-text: #11603a;
  --skip: #a9afb5; --shadow: 0 8px 24px rgba(0,0,0,.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--body);
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 50% -200px, rgba(245,179,1,.08), transparent 70%),
    /* diamond tread-plate texture */
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 14px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 14px),
    var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ----------------------------- Header ----------------------------- */
.hazard { height: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, #111 14px 28px); }
header.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.logo { display: flex; align-items: center; gap: 10px; margin-right: auto; text-decoration: none; color: var(--text); }
.logo svg { width: 34px; height: 34px; }
.logo h1 { font-family: var(--head); font-size: 1.55rem; letter-spacing: .14em; margin: 0; font-weight: 800; line-height: 1; }
.logo h1 span { color: var(--accent); }
.logo small { display: block; font-size: .66rem; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; margin-top: 3px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); display: grid; place-items: center; transition: transform .15s, border-color .15s;
}
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.icon-btn svg { width: 20px; height: 20px; }

main { max-width: 880px; margin: 0 auto; padding: 16px 16px 60px; }

/* ----------------------------- Mode tabs ----------------------------- */
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.mode {
  border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 6px;
  font-family: var(--head); text-transform: uppercase; letter-spacing: .1em; font-size: .82rem; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .2s;
  position: relative; overflow: hidden;
}
.mode .ico { font-size: 1.2rem; }
.mode small { font-family: var(--body); letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--muted); font-size: .7rem; }
.mode[aria-selected="true"] { border-color: var(--accent); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, var(--panel)), var(--panel)); box-shadow: inset 0 -3px 0 var(--accent); }
.mode:hover { transform: translateY(-1px); }

/* --------------------------- Info bar & panels --------------------------- */
.infobar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px;
  font-size: .9rem;
}
.infobar .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: .8rem; white-space: nowrap; }
.pill b { color: var(--accent); }
.btn {
  border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 10px 16px;
  font-weight: 650; transition: transform .12s, background .2s, border-color .2s; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #17140a; }
.btn.primary:hover:not(:disabled) { background: #ffc531; }
.btn.small { padding: 6px 10px; font-size: .82rem; }
.btn.danger { border-color: var(--miss); color: var(--miss); }

/* Career XP bar */
.xpbar { height: 10px; background: var(--bg2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); min-width: 140px; flex: 1; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }

/* Filters */
.filters { padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; animation: drop .25s ease; }
.filters h4 { margin: 4px 0 8px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg2); padding: 5px 10px; border-radius: 999px; font-size: .8rem; transition: all .15s; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--bg2)); border-color: var(--accent); }
.chip.locked { opacity: .5; }

/* ----------------------------- Job card ----------------------------- */
.job {
  background: linear-gradient(180deg, var(--panel), var(--bg2));
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; position: relative;
}
.job-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.job-head .wo { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.job-head .title { font-family: var(--head); text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
.diff { font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.diff.easy { background: #1f4d34; color: #8ff0b8; }
.diff.medium { background: #4d3f12; color: #ffd76a; }
.diff.hard { background: #5a2a12; color: #ffab73; }
.diff.expert { background: #551a2b; color: #ff9cb6; }
html.light .diff.easy { background: #c9efd8; color: #15663a; }
html.light .diff.medium { background: #fbe9b5; color: #7a5a00; }
html.light .diff.hard { background: #ffd8c0; color: #8a3a0c; }
html.light .diff.expert { background: #ffd0dc; color: #8a1838; }

/* Progress: six LED segments */
.progress { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.leds { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; flex: 1; }
.led { height: 10px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); transition: background .3s, box-shadow .3s; }
.led.on { background: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); border-color: transparent; }
.led.miss { background: var(--miss); border-color: transparent; }
.led.close { background: var(--close); border-color: transparent; }
.led.hit { background: var(--hit); box-shadow: 0 0 12px var(--hit); border-color: transparent; }
.led.skip { background: var(--skip); border-color: transparent; }
.clue-count { font-family: var(--head); font-weight: 800; letter-spacing: .1em; font-size: .9rem; white-space: nowrap; }
.worth { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.worth b { color: var(--accent); }

/* Timer ring for Timed mode */
.timer { --p: 1; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: conic-gradient(var(--tc, var(--hit)) calc(var(--p) * 360deg), var(--bg) 0); }
.timer span { width: 36px; height: 36px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: .9rem; }
.timer.low span { color: var(--miss); animation: pulse .5s infinite alternate; }

/* Clue list styled like a diagnostic screen */
.screen { margin: 0 16px 14px; background: var(--screen); border-radius: 10px; border: 1px solid #1f3a2b; padding: 6px; box-shadow: inset 0 0 30px rgba(0,0,0,.5); }
html.light .screen { border-color: #b8d3c2; box-shadow: inset 0 0 12px rgba(0,0,0,.06); }
.clue { display: flex; gap: 12px; padding: 10px 10px; border-radius: 8px; color: var(--screen-text); font-family: var(--mono); font-size: .93rem; line-height: 1.45; }
.clue + .clue { border-top: 1px dashed color-mix(in srgb, var(--screen-text) 20%, transparent); }
.clue .n { flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: .8rem;
  background: color-mix(in srgb, var(--screen-text) 14%, transparent); }
.clue.new { animation: clueIn .55s cubic-bezier(.2,.9,.3,1.2); }
.clue.new .txt { animation: typeGlow 1.2s ease; }
.clue.locked { color: color-mix(in srgb, var(--screen-text) 35%, transparent); }
.clue.locked .txt { letter-spacing: .3em; }

/* Guess history */
.guesses { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 12px; }
.guess { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; font-size: .9rem; border: 1px solid transparent; animation: drop .3s ease; }
.guess .tag { font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-left: auto; white-space: nowrap; opacity: .9; }
.guess.miss { background: color-mix(in srgb, var(--miss) 16%, transparent); border-color: color-mix(in srgb, var(--miss) 45%, transparent); }
.guess.close { background: color-mix(in srgb, var(--close) 16%, transparent); border-color: color-mix(in srgb, var(--close) 45%, transparent); }
.guess.hit { background: color-mix(in srgb, var(--hit) 18%, transparent); border-color: var(--hit); }
.guess .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.guess.miss .dot { background: var(--miss); } .guess.close .dot { background: var(--close); } .guess.hit .dot { background: var(--hit); }

/* ------------------------- Diagnosis input ------------------------- */
.controls { padding: 14px 16px 16px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
.combo { position: relative; }
.combo input {
  width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s;
}
.combo input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.combo .search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.combo.shake { animation: shake .4s; }
.suggest {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); max-height: 300px; overflow-y: auto; z-index: 30;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
  animation: drop .15s ease;
}
.suggest .opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; border: 0; background: transparent; font-size: .92rem; }
.suggest .opt small { margin-left: auto; color: var(--muted); font-size: .72rem; white-space: nowrap; }
.suggest .opt mark { background: transparent; color: var(--accent); font-weight: 750; }
.suggest .opt[aria-selected="true"], .suggest .opt:hover { background: var(--panel2); }
.suggest .opt.tried { opacity: .4; text-decoration: line-through; }
.suggest .hint { padding: 10px; color: var(--muted); font-size: .85rem; }

/* ----------------------------- Result ----------------------------- */
.result { padding: 18px 16px; border-top: 1px dashed var(--line); text-align: center; animation: drop .4s ease; position: relative; }
.stamp {
  display: inline-block; font-family: var(--head); font-weight: 900; letter-spacing: .18em; text-transform: uppercase; font-size: 1.3rem;
  padding: 6px 16px; border: 3px solid currentColor; border-radius: 8px; transform: rotate(-4deg); animation: stamp .45s cubic-bezier(.2,1.6,.4,1);
}
.stamp.win { color: var(--hit); } .stamp.lose { color: var(--miss); }
.answer { font-size: 1.35rem; font-weight: 800; margin: 14px 0 4px; }
.answer-meta { color: var(--muted); font-size: .85rem; }
.score-line { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.score-line .pill { font-size: .9rem; padding: 6px 12px; }
.result .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.next-daily { margin-top: 12px; color: var(--muted); font-size: .85rem; font-family: var(--mono); }

/* Legend under the card */
.legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; color: var(--muted); font-size: .78rem; margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ----------------------------- Modals ----------------------------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .2s ease; }
.modal { width: min(640px, 100%); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); animation: pop .25s cubic-bezier(.2,1.2,.4,1); }
.modal-head { position: sticky; top: 0; background: var(--panel); display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); z-index: 1; }
.modal-head h2 { margin: 0; font-family: var(--head); letter-spacing: .12em; text-transform: uppercase; font-size: 1.05rem; margin-right: auto; }
.modal-body { padding: 16px 18px 20px; }
.modal-body h3 { font-family: var(--head); letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; color: var(--muted); margin: 20px 0 10px; }
.modal-body h3:first-child { margin-top: 0; }
.modal-body p, .modal-body li { line-height: 1.55; font-size: .93rem; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.tile { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile b { display: block; font-family: var(--head); font-size: 1.5rem; font-weight: 800; }
.tile span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.bars { display: flex; flex-direction: column; gap: 5px; }
.bar { display: grid; grid-template-columns: 110px 1fr 54px; align-items: center; gap: 8px; font-size: .82rem; }
.bar .track { height: 18px; background: var(--bg2); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--skip); border-radius: 5px; transition: width .7s cubic-bezier(.2,.8,.2,1); min-width: 2px; }
.bar .fill.hl { background: var(--accent); }
.bar .num { text-align: right; font-family: var(--mono); color: var(--muted); }
.history { display: flex; flex-direction: column; gap: 4px; font-size: .84rem; }
.history div { display: flex; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--bg2); }
.history div span:last-child { margin-left: auto; color: var(--muted); font-family: var(--mono); }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
.ach .badge { font-size: 1.5rem; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--panel2); flex-shrink: 0; }
.ach b { display: block; font-size: .88rem; } .ach small { color: var(--muted); font-size: .74rem; line-height: 1.3; display: block; }
.ach.locked { opacity: .45; } .ach.locked .badge { filter: grayscale(1); }
.ach.got { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }

table.mini { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.mini td, table.mini th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch { width: 46px; height: 26px; border-radius: 99px; background: var(--bg2); border: 1px solid var(--line); position: relative; transition: background .2s; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 35%, var(--bg2)); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent); }

/* ----------------------------- Toasts & FX ----------------------------- */
.toasts { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { background: var(--panel2); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: .9rem; animation: toastIn .35s cubic-bezier(.2,1.3,.4,1); }
.toast.out { animation: toastOut .3s ease forwards; }
.toast b { color: var(--accent); }
.spark { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 70; animation: spark .9s ease-out forwards; }

@keyframes clueIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes typeGlow { 0% { text-shadow: 0 0 12px var(--screen-text); } 100% { text-shadow: none; } }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%,100% { transform: none; } 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
@keyframes stamp { from { transform: rotate(-4deg) scale(2.4); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } }
@keyframes pulse { to { opacity: .4; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.95); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ----------------------------- Mobile ----------------------------- */
@media (max-width: 600px) {
  .top-inner { padding: 8px 12px; gap: 6px; }
  .logo small { display: none; }
  .logo h1 { font-size: 1.25rem; }
  .icon-btn { width: 36px; height: 36px; }
  main { padding: 12px 10px 40px; }
  .modes { gap: 6px; }
  .mode { padding: 8px 2px; font-size: .7rem; letter-spacing: .05em; }
  .mode small { display: none; }
  .controls { grid-template-columns: 1fr 1fr; }
  .controls .combo { grid-column: 1 / -1; }
  .clue { font-size: .86rem; }
  .screen { margin: 0 10px 12px; }
  .progress, .job-head, .guesses, .controls { padding-left: 12px; padding-right: 12px; }
  .bar { grid-template-columns: 84px 1fr 46px; }
}

</style>
</head>
<body>
<div class="hazard"></div>
<header class="top">
  <div class="top-inner">
    <a class="logo" href="#" aria-label="FAULTLE home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#f5b301"/><path d="M44 12a12 12 0 0 0-11 16L14 47a4.5 4.5 0 0 0 6 6l19-19a12 12 0 0 0 16-11l-7 4-6-3-1-7z" fill="#111"/></svg>
      <div><h1>FAULT<span>LE</span></h1><small>Diagnose the fault in six clues</small></div>

<script>

const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const fmt = n => Number(n).toLocaleString('en-GB');

/** Deterministic PRNG so the daily order is identical for everyone. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
/** Local-calendar date key, e.g. 2026-11-18. */
function dateKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDays(key, n) {
  const [y, m, d] = key.split('-').map(Number);
  return dateKey(new Date(y, m - 1, d + n));
}
function levenshtein(a, b) {
  const dp = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = dp[j];
      dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;

  return dp[b.length];

    recent: []
  });
  /** Merge saved data over defaults so new fields survive upgrades. */
  function merge(base, saved) {
    if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return saved === undefined ? base : saved;

/* ============================ SOUND (Web Audio, no assets) ============================ */
const Sfx = (() => {
  let ctx = null, gestured = false;
  // Browsers only allow audio after a user gesture; wait for one before creating the context.
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { gestured = true; }, { capture: true, once: true }));
  function ac() {
    if (!gestured) return null;
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, { dur = 0.12, type = 'sine', vol = 0.15, delay = 0, slide = 0 } = {}) {
    if (!Store.data.settings.sound) return;

    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();

    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);

    },
    lose: () => [392, 330, 247].forEach((f, i) => tone(f, { dur: 0.28, vol: 0.11, delay: i * 0.16 })),
    tick: () => tone(1500, { dur: 0.03, type: 'square', vol: 0.035 }),
    achieve: () => [880, 1175, 1568].forEach((f, i) => tone(f, { dur: 0.3, vol: 0.09, delay: i * 0.09 })),
    rank: () => [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, { dur: 0.25, type: 'triangle', vol: 0.1, delay: i * 0.09 }))
  };
})();

/* ============================ DAILY SEED ============================ */
/** Puzzle #1 is 1 Jan 2026. A fixed shuffle means no repeats for FAULTS.length days. */
function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2026, 0, 1)) / 864e5) + 1;
}
const DAILY_ORDER = (() => {
  const idx = FAULTS.map((_, i) => i);
  const r = mulberry32(0xFA017);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
})();
function dailyFault(key) {
  const n = dayNumber(key), N = FAULTS.length;
  return FAULTS[DAILY_ORDER[(((n - 1) % N) + N) % N]];
}
/** Streak is only "live" if the last win was today or yesterday. */
function dailyStreak() {
  const d = Store.data.daily, t = dateKey();
  return d.lastWon && (d.lastWon === t || d.lastWon === addDays(t, -1)) ? d.streak : 0;
}

function rankIndex(xp) { let r = 0; RANKS.forEach((k, i) => { if (xp >= k.xp) r = i; }); return r; }

const ACHIEVEMENTS = [

/* ============================ ROUND ENGINE ============================ */
/** Global session state. One round is cached per mode so switching tabs never loses progress. */
const G = { mode: 'daily', rounds: {}, shift: { score: 0, solved: 0 }, timerId: null, animClue: false, showFilters: false };

function makeRound(fault, mode) {
  return { fault, mode, revealed: 1, steps: [], guesses: [], status: 'playing', score: 0, bonus: 0, xp: 0,
           timeLeft: mode === 'timed' ? TIME_LIMIT : null, dateKey: mode === 'daily' ? dateKey() : null };
}

/** Random pick that avoids recently seen faults where the pool allows it. */
function pickFrom(pool, weights) {
  if (!pool.length) return null;
  const recent = new Set(Store.data.recent);
  let candidates = pool.map((f, i) => [f, weights ? weights[i] : 1]);
  const fresh = candidates.filter(([f]) => !recent.has(f.id));
  if (fresh.length >= Math.min(5, candidates.length)) candidates = fresh;
  const total = candidates.reduce((a, [, w]) => a + w, 0);
  let x = Math.random() * total;
  for (const [f, w] of candidates) { if ((x -= w) <= 0) return f; }
  return candidates[candidates.length - 1][0];
}
function endlessPool() {
  const { diff, cats } = Store.data.settings;
  return FAULTS.filter(f => diff.includes(f.difficulty) && cats.includes(f.category));
}
function careerPool() {
  const rank = RANKS[rankIndex(Store.data.stats.xp)];
  const pool = FAULTS.filter(f => rank.unlocks.includes(f.difficulty));
  const newest = rank.unlocks[rank.unlocks.length - 1];
  return { pool, weights: pool.map(f => (f.difficulty === newest && rank.unlocks.length > 1 ? 2.5 : 1)) };
}

/** Build (or restore) the round for a mode. */
function roundFor(mode, forceNew = false) {
  if (mode === 'daily') {
    const key = dateKey(), fault = dailyFault(key), d = Store.data.daily;
    const cached = G.rounds.daily;
    if (cached && cached.dateKey === key && !forceNew) return cached;
    const r = makeRound(fault, 'daily');
    const res = d.results[key];
    const prog = d.progress && d.progress.date === key ? d.progress : null;
    const src = res || prog;
    if (src) { r.revealed = src.revealed; r.steps = src.steps.slice(); r.guesses = src.guesses.slice(); }
    if (res) { r.status = res.won ? 'won' : 'lost'; r.score = res.score; r.xp = res.xp || 0; r.restored = true; }
    return (G.rounds.daily = r);
  }
  if (!forceNew && G.rounds[mode]) return G.rounds[mode];
  let fault = null;
  if (mode === 'endless') fault = pickFrom(endlessPool());
  else if (mode === 'career') { const { pool, weights } = careerPool(); fault = pickFrom(pool, weights); }
  else fault = pickFrom(FAULTS);
  return (G.rounds[mode] = fault ? makeRound(fault, mode) : null);
}

function saveDailyProgress(r) {
  if (r.mode !== 'daily' || r.status !== 'playing') return;
  Store.data.daily.progress = { date: r.dateKey, revealed: r.revealed, steps: r.steps, guesses: r.guesses };
  Store.save();
}

/** Player commits a diagnosis. */
function submitGuess(text) {
  const r = G.round;
  if (!r || r.status !== 'playing') return;
  const opt = OPTION_BY_NAME.get(String(text).trim().toLowerCase());
  if (!opt) { shakeInput(); toast('Pick a diagnosis from the list.'); return; }
  if (r.guesses.some(g => g.name === opt.name)) { shakeInput(); toast('You’ve already ruled that one out.'); return; }

  const correct = opt.name === r.fault.diagnosis;
  const result = correct ? 'hit' : opt.category === r.fault.category ? 'close' : 'miss';
  r.guesses.push({ name: opt.name, category: opt.category, result, clue: r.revealed });
  r.steps.push(result);

  if (correct) return finish(true);
  Sfx[result]();
  if (r.revealed >= 6) return finish(false);
  r.revealed++; G.animClue = true;
  setTimeout(Sfx.reveal, 220);
  saveDailyProgress(r);
  renderBoard(true);
}

/** Reveal the next clue without guessing (or give up on the last clue). */
function skipClue() {
  const r = G.round;
  if (!r || r.status !== 'playing') return;
  r.steps.push('skip');
  if (r.revealed >= 6) return finish(false, 'gaveup');
  r.revealed++; G.animClue = true;
  Sfx.reveal();
  saveDailyProgress(r);
  renderBoard(true);
}

/** End of a round: scoring, XP, stats, streaks, achievements. */
function finish(won, reason) {
  const r = G.round;
  stopTimer();
  r.status = won ? 'won' : 'lost';
  r.reason = reason;
  const base = won ? POINTS[r.revealed - 1] : 0;
  r.bonus = won && r.mode === 'timed' ? Math.ceil(r.timeLeft) * 2 : 0;
  r.score = base + r.bonus;
  r.xp = won ? Math.round(r.score * DIFF_MULT[r.fault.difficulty] * (r.mode === 'career' ? 1.5 : 1)) : 5;

  const s = Store.data.stats;
  const rankBefore = rankIndex(s.xp);
  s.played++; s.score += r.score; s.xp += r.xp;
  s.guesses += r.guesses.length;
  if (won) { s.wins++; s.correctGuesses++; s.cluesOnWins += r.revealed; s.dist[r.revealed - 1]++; s.winStreak++; s.bestWinStreak = Math.max(s.bestWinStreak, s.winStreak); }
  else { s.losses++; s.winStreak = 0; }
  const bump = (obj, k) => { obj[k] = obj[k] || { p: 0, w: 0 }; obj[k].p++; if (won) obj[k].w++; };
  bump(s.byCat, r.fault.category); bump(s.byMode, r.mode); bump(s.byDiff, r.fault.difficulty);
  if (won) s.solved[r.fault.id] = (s.solved[r.fault.id] || 0) + 1;
  s.history.unshift({ d: r.fault.diagnosis, m: r.mode, w: won, c: r.revealed, s: r.score, t: Date.now() });
  s.history.length = Math.min(s.history.length, 40);
  Store.data.recent = [r.fault.id, ...Store.data.recent.filter(id => id !== r.fault.id)].slice(0, 30);

  if (r.mode === 'daily') {
    const d = Store.data.daily, key = r.dateKey;
    if (won) { d.streak = d.lastWon === addDays(key, -1) ? d.streak + 1 : (d.lastWon === key ? d.streak : 1); d.lastWon = key; d.maxStreak = Math.max(d.maxStreak, d.streak); }
    else d.streak = 0;
    d.results[key] = { won, revealed: r.revealed, steps: r.steps, guesses: r.guesses, score: r.score, xp: r.xp };
    d.progress = null;
  }
  if (r.mode === 'timed') {
    if (won) { G.shift.solved++; G.shift.score += r.score; }
    s.bestShift = Math.max(s.bestShift, G.shift.score);
  }
  checkAchievements(r);
  Store.save();

  const rankAfter = rankIndex(s.xp);
  if (rankAfter > rankBefore) setTimeout(() => { Sfx.rank(); toast(`🎓 Promoted to <b>${RANKS[rankAfter].name}</b>! New jobs unlocked in Career.`, 5000); }, 700);

  if (won) { Sfx.win(); setTimeout(() => sparks($('.stamp')), 60); } else Sfx.lose();
  renderAll();
}

/* ============================ TIMER (Timed mode) ============================ */
function startTimer() {
  stopTimer();
  const r = G.round;
  if (!r || r.mode !== 'timed' || r.status !== 'playing') return;
  let last = performance.now(), lastSec = Math.ceil(r.timeLeft);
  G.timerId = setInterval(() => {
    const now = performance.now();
    r.timeLeft = Math.max(0, r.timeLeft - (now - last) / 1000); last = now;
    const sec = Math.ceil(r.timeLeft);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 10 && sec > 0) Sfx.tick(); }
    updateTimerUI();
    if (r.timeLeft <= 0) finish(false, 'time');
  }, 100);
}
function stopTimer() { if (G.timerId) clearInterval(G.timerId); G.timerId = null; }
function updateTimerUI() {
  const el = $('#timer'), r = G.round;
  if (!el || !r) return;
  const p = r.timeLeft / TIME_LIMIT;
  el.style.setProperty('--p', p.toFixed(3));
  el.style.setProperty('--tc', p > 0.5 ? 'var(--hit)' : p > 0.2 ? 'var(--close)' : 'var(--miss)');
  el.classList.toggle('low', r.timeLeft <= 10);
  el.firstElementChild.textContent = Math.ceil(r.timeLeft);
}

function sparks(el) {

  const b = el.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  const colours = ['#f5b301', '#ff7a1a', '#fff3c4', '#3ddc84'];
  for (let i = 0; i < 28; i++) {

    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);

/* ============================ AUTOCOMPLETE ============================ */
/** Options appear only after 2+ characters, so the list can't simply be scanned.
 *  Ranking: every token must match; prefix and word-start matches score higher.
 *  Falls back to typo-tolerant matching (edit distance) when nothing matches. */
function searchOptions(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) return [];
  const toks = q.split(/\s+/).filter(Boolean);
  const scored = [];
  for (const o of OPTIONS) {
    const name = o.name.toLowerCase(), hay = name + ' ' + o.category.toLowerCase();
    let score = 0, ok = true;
    for (const t of toks) {
      const i = hay.indexOf(t);
      if (i < 0) { ok = false; break; }
      score += i === 0 ? 4 : /[\s(\-/]/.test(hay[i - 1]) ? 3 : 1;
      if (i >= name.length) score -= 1;           // category-only matches rank lower
    }
    if (ok) scored.push([score + (name.startsWith(q) ? 6 : 0), o]);
  }
  if (!scored.length) {
    for (const o of OPTIONS) {
      const words = (o.name + ' ' + o.category).toLowerCase().split(/[\s()\-/]+/);
      const ok = toks.every(t => t.length < 3 || words.some(w => levenshtein(t, w.slice(0, t.length)) <= (t.length >= 6 ? 2 : 1)));
      if (ok && toks.some(t => t.length >= 3)) scored.push([0, o]);
    }
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name)).map(x => x[1]);
}
function highlight(name, q) {
  let out = esc(name);
  q.trim().toLowerCase().split(/\s+/).filter(t => t.length > 0).forEach(t => {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}

function bindCombo() {
  const input = $('#guess-input'), list = $('#suggest');
  let items = [], active = -1;
  const tried = new Set(G.round.guesses.map(g => g.name));

  function open(show) { list.classList.toggle('hidden', !show); input.setAttribute('aria-expanded', show); }
  function draw() {
    const q = input.value;
    const all = searchOptions(q);
    items = all.slice(0, 12);
    const more = all.length - items.length;
    if (q.trim().length < 2) { open(false); return; }
    if (!items.length) { list.innerHTML = `<div class="hint">No match. Try a component or symptom word: “pump”, “sensor”, “leak”.</div>`; open(true); return; }
    if (active >= items.length) active = items.length - 1;
    list.innerHTML = items.map((o, i) => `<button type="button" class="opt${tried.has(o.name) ? ' tried' : ''}" role="option" data-i="${i}" aria-selected="${i === active}">
      <span>${highlight(o.name, q)}</span><small>${esc(o.category)}</small></button>`).join('')
      + (more > 0 ? `<div class="hint">+${more} more. Keep typing to narrow it down.</div>` : '');
    open(true);
  }
  function choose(i) {
    const o = items[i]; if (!o) return;
    input.value = o.name; open(false); active = -1; Sfx.click(); input.focus();
  }
  input.addEventListener('input', () => { active = 0; draw(); });
  input.addEventListener('focus', () => { if (input.value.trim().length >= 2) draw(); });
  input.addEventListener('blur', () => setTimeout(() => open(false), 150));
  input.addEventListener('keydown', e => {
    const isOpen = !list.classList.contains('hidden') && items.length;
    if (e.key === 'ArrowDown' && isOpen) { e.preventDefault(); active = (active + 1) % items.length; draw(); }
    else if (e.key === 'ArrowUp' && isOpen) { e.preventDefault(); active = (active - 1 + items.length) % items.length; draw(); }
    else if (e.key === 'Escape') open(false);
    else if (e.key === 'Enter') {
      e.preventDefault();
      // Exact match → submit. Otherwise first Enter fills the highlighted option, second submits.
      if (OPTION_BY_NAME.has(input.value.trim().toLowerCase()) && (!isOpen || items[active]?.name.toLowerCase() === input.value.trim().toLowerCase())) submitGuess(input.value);
      else if (isOpen && active >= 0) choose(active);
      else submitGuess(input.value);
    }
  });
  list.addEventListener('mousedown', e => e.preventDefault());   // keep focus in the input
  list.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) choose(+b.dataset.i); });
}

  ].map(([v, l]) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('');

  const solvedUnique = Object.keys(s.solved).length;

  return `<div class="tiles">${tiles}</div>

}

function achievementsHTML() {

  const n = ACHIEVEMENTS.filter(a => got[a.id]).length;
  return `<p>${n} of ${ACHIEVEMENTS.length} unlocked.</p><div class="ach-grid">${ACHIEVEMENTS.map(a => `
    <div class="ach ${got[a.id] ? 'got' : 'locked'}"><div class="badge">${a.icon}</div>
      <div><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div></div>`).join('')}</div>`;
}

function helpHTML() {
  return `<p>A car has come into the workshop. Read the job sheet and <b>diagnose the fault</b> in as few clues as you can.</p>
    <ul>
      <li>Clue 1 is what the customer says at the counter. Each new clue adds what you'd find with more time, tools and tests.</li>
      <li>Type in the search box (2+ letters) and choose a diagnosis from the ${OPTIONS.length} options, then press <b>Diagnose</b>.</li>
      <li>A wrong diagnosis reveals the next clue. You can also take the next clue without guessing.</li>
      <li>After clue 6, one last wrong call reveals the answer.</li>
    </ul>
    <h3>Feedback</h3>
    <div class="guess hit"><span class="dot"></span>Correct diagnosis</div>
    <div class="guess close" style="margin-top:6px"><span class="dot"></span>Right system (e.g. Cooling), wrong fault</div>
    <div class="guess miss" style="margin-top:6px"><span class="dot"></span>Wrong system entirely</div>
    <h3>Scoring</h3>
    <table class="mini"><tr><th>Solved on clue</th>${POINTS.map((_, i) => `<td>${i + 1}</td>`).join('')}</tr>
      <tr><th>Points</th>${POINTS.map(p => `<td>${p}</td>`).join('')}</tr></table>
    <p>XP = points × difficulty (Easy ×1, Medium ×1.25, Hard ×1.5, Expert ×2). Career jobs earn ×1.5 XP. A failed job still earns 5 XP for the experience.</p>
    <h3>Modes</h3>
    <ul><li><b>Daily</b>: the same job for everyone today, with a streak to protect.</li>
      <li><b>Endless</b>: random jobs, filtered by difficulty and system.</li>
      <li><b>Career</b>: start as an Apprentice on easy jobs and earn XP to unlock harder diagnostics.</li>
      <li><b>Timed</b>: ${TIME_LIMIT} seconds per job, with +2 points for every second left. One failure ends the shift.</li></ul>
    <h3>Ranks</h3>
    <table class="mini">${RANKS.map(r => `<tr><td>${r.name}</td><td>${fmt(r.xp)} XP</td><td>${r.unlocks.map(cap).join(', ')}</td></tr>`).join('')}</table>
    <p style="margin-top:14px;color:var(--muted);font-size:.82rem">${FAULTS.length} fault scenarios across ${CATEGORIES.length} systems. Clues describe typical presentations. Real faults vary, so always test before replacing parts.</p>`;
}

function settingsHTML() {
  const st = Store.data.settings;
  return `<div class="row"><div><b>Sound effects</b><br><small style="color:var(--muted)">Generated live in your browser</small></div>
      <button class="switch" data-toggle="sound" role="switch" aria-checked="${st.sound}"></button></div>
    <div class="row"><div><b>Dark workshop theme</b><br><small style="color:var(--muted)">Turn off for a daylight bay</small></div>
      <button class="switch" data-toggle="theme" role="switch" aria-checked="${st.theme === 'dark'}"></button></div>
    <div class="row"><div><b>Reset all progress</b><br><small style="color:var(--muted)">Stats, XP, streaks and achievements</small></div>
      <button class="btn small danger" id="btn-reset">Reset…</button></div>`;
}

/* ============================ SHARE ============================ */
function shareText(r) {
  const map = { skip: '⬜', miss: '🟥', close: '🟧', hit: '🟩' };
  const line = r.steps.map(x => map[x]).join('');
  const title = r.mode === 'daily' ? `FAULTLE Daily #${dayNumber(r.dateKey)}` : `FAULTLE ${cap(r.mode)}`;
  const res = r.status === 'won' ? `${r.revealed}/6` : 'X/6';
  const extra = r.mode === 'daily' ? ` · 🔥${dailyStreak()}` : r.mode === 'timed' ? ` · ⏱️${Math.ceil(r.timeLeft)}s left` : '';
  return `${title} 🔧 ${res}\n${line}\n${r.score} pts · ${cap(r.fault.difficulty)}${extra}`;
}
async function share(r) {
  const text = shareText(r);
  try {
    if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    toast('📋 Result copied to clipboard');
  } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) { /* ignore */ }
    ta.remove();
    toast(ok ? '📋 Result copied to clipboard' : esc(text).replace(/\n/g, '<br>'), ok ? 2600 : 6000);
  }
}

/* ============================ EVENTS ============================ */
function switchMode(mode) {
  if (mode === G.mode) return;
  stopTimer(); Sfx.click();
  G.mode = mode;
  renderAll();
}
function nextJob() {
  const r = G.round;
  if (r && r.mode === 'timed' && r.status === 'lost') G.shift = { score: 0, solved: 0 };
  G.rounds[G.mode] = null;
  G.animClue = true;
  renderAll();
  Sfx.reveal();
  const inp = $('#guess-input'); if (inp && window.matchMedia('(pointer:fine)').matches) inp.focus();
}

document.addEventListener('click', e => {
  const t = e.target;
  const mode = t.closest('[data-mode]'); if (mode) return switchMode(mode.dataset.mode);
  const go = t.closest('[data-goto]'); if (go) return switchMode(go.dataset.goto);
  if (t.closest('#btn-guess')) return submitGuess($('#guess-input').value);
  if (t.closest('#btn-skip')) return skipClue();
  if (t.closest('#btn-next')) return nextJob();
  if (t.closest('#btn-share')) return share(G.round);
  if (t.closest('#btn-help')) return openModal('How to play', helpHTML());
  if (t.closest('#btn-stats') || t.closest('[data-open="stats"]')) return openModal('Workshop statistics', statsHTML());
  if (t.closest('#btn-ach')) return openModal('Achievements', achievementsHTML());
  if (t.closest('#btn-settings')) return openModal('Settings', settingsHTML());
  if (t.closest('#modal-close') || t.id === 'modal-bg') return closeModal();
  if (t.closest('#btn-sound')) { Store.data.settings.sound = !Store.data.settings.sound; Store.save(); renderSoundBtn(); Sfx.click(); return; }
  if (t.closest('#btn-filters')) { G.showFilters = !G.showFilters; Sfx.click(); renderInfobar(); renderFilters(); return; }

  const tog = t.closest('[data-toggle]');
  if (tog) {
    const st = Store.data.settings;
    if (tog.dataset.toggle === 'sound') st.sound = !st.sound;
    if (tog.dataset.toggle === 'theme') { st.theme = st.theme === 'dark' ? 'light' : 'dark'; applyTheme(); }
    Store.save(); Sfx.click(); renderSoundBtn();
    tog.setAttribute('aria-checked', tog.dataset.toggle === 'sound' ? st.sound : st.theme === 'dark');
    return;
  }
  if (t.closest('#btn-reset')) {
    const b = t.closest('#btn-reset');
    if (b.dataset.armed) { Store.reset(); G.rounds = {}; G.shift = { score: 0, solved: 0 }; stopTimer(); closeModal(); applyTheme(); renderAll(); toast('Progress reset. Fresh overalls!'); }
    else { b.dataset.armed = '1'; b.textContent = 'Tap again to confirm'; }
    return;
  }

  // Endless filters: changing them starts a fresh job from the new pool.
  const st = Store.data.settings;
  const fd = t.closest('[data-fdiff]'), fc = t.closest('[data-fcat]');
  if (fd || fc || t.closest('[data-fall]') || t.closest('[data-fnone]')) {
    if (fd) { const d = fd.dataset.fdiff; st.diff = st.diff.includes(d) ? st.diff.filter(x => x !== d) : [...st.diff, d]; }
    if (fc) { const c = fc.dataset.fcat; st.cats = st.cats.includes(c) ? st.cats.filter(x => x !== c) : [...st.cats, c]; }
    if (t.closest('[data-fall]')) { st.diff = [...DIFFICULTIES]; st.cats = [...CATEGORIES]; }
    if (t.closest('[data-fnone]')) st.cats = [];
    Store.save(); Sfx.click();
    const cur = G.rounds.endless;
    if (!cur || cur.status !== 'playing' || !st.diff.includes(cur.fault.difficulty) || !st.cats.includes(cur.fault.category)) G.rounds.endless = null;
    renderInfobar(); renderFilters(); renderBoard();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-bg')) closeModal();
  if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') { const i = $('#guess-input'); if (i) { e.preventDefault(); i.focus(); } }
});

function applyTheme() {
  document.documentElement.classList.toggle('light', Store.data.settings.theme === 'light');
  document.querySelector('meta[name=theme-color]').content = Store.data.settings.theme === 'light' ? '#e9e6df' : '#0f1113';
}

/* ============================ BOOT ============================ */
Store.load();
applyTheme();
renderAll();
if (!Store.data.settings.seenHelp) { openModal('How to play', helpHTML()); Store.data.settings.seenHelp = true; Store.save(); }

</script>
</body>
</html>
